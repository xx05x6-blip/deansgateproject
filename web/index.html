  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const INITIAL_STORE_ITEMS = [

      { id: 2, name: "Almond Croissant", category: "Bakery", price: 3.40, unit: "Artisan Pastry", badge: "Popular", imageUrl: "" },
      { id: 3, name: "Pain au Chocolat", category: "Bakery", price: 3.10, unit: "Warm Bakery", badge: "Fresh Daily", imageUrl: "" },
      { id: 4, name: "Organic Whole Milk", category: "Pantry", price: 1.95, unit: "1 Litre", badge: "Staple", imageUrl: "" },
      { id: 5, name: "Oat Milk (Barista)", category: "Pantry", price: 2.30, unit: "1 Litre", badge: "Vegan", imageUrl: "" },
      { id: 6, name: "Free Range Eggs (6pk)", category: "Pantry", price: 2.75, unit: "Half Dozen", badge: "Organic", imageUrl: "" },
      { id: 7, name: "San Pellegrino Lemon", category: "Cold Drinks", price: 1.80, unit: "330ml Can", badge: "Chilled", imageUrl: "" },
      { id: 8, name: "Diet Coke Can", category: "Cold Drinks", price: 1.50, unit: "330ml Can", badge: "Chilled", imageUrl: "" },
      { id: 9, name: "Fresh Orange Juice", category: "Cold Drinks", price: 3.20, unit: "500ml Chilled", badge: "Cold Pressed", imageUrl: "" },

      { id: 13, name: "Proper Chips Sea Salt", category: "Snacks", price: 1.75, unit: "85g Bag", badge: "Vegan", imageUrl: "" },
      { id: 14, name: "Salted Caramel Gelato", category: "Snacks", price: 5.40, unit: "500ml Tub", badge: "Freezer", imageUrl: "" },
      { id: 15, name: "Tony's Chocolonely Caramel", category: "Snacks", price: 3.85, unit: "180g Bar", badge: "Fairtrade", imageUrl: "" },
      { id: 16, name: "Hayati Pro Ultra Pod Refill", category: "Late Night", price: 9.99, unit: "Pack of 2", badge: "18+ ID Req", imageUrl: "" },
      { id: 17, name: "Paracetamol Extra (16pk)", category: "Late Night", price: 1.80, unit: "Box of 16", badge: "Pharmacy", imageUrl: "" }
    ];

    const TOWERS = [
      { id: "SOUTH", name: "South", floors: 65 },
      { id: "EAST", name: "East", floors: 50 },
      { id: "WEST", name: "West", floors: 44 },
      { id: "NORTH", name: "North", floors: 37 }
    ];

    const STAGES = [
      { key: "PLACED", label: "Placed", next: "ACCEPTED", btn: "Accept Order" },
      { key: "ACCEPTED", label: "Accepted", next: "PICKED_UP", btn: "In Lift" },
      { key: "PICKED_UP", label: "In Lift", next: "DELIVERED", btn: "Confirm Drop" },
      { key: "DELIVERED", label: "Delivered", next: null, btn: "Completed" }
    ];

    function playElevatorChime() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(659.25, now);
        osc.frequency.setValueAtTime(523.25, now + 0.3);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.8);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.8);
      } catch (e) {}
    }

    // Master Unified Web App
    function DeansgateApp() {
      const [currentView, setCurrentView] = useState("storefront"); // "storefront" | "runner" | "admin"
      const [isAdminAuthenticated, setIsAdminAuthenticated] = useState(false);
      const [isRunnerAuthenticated, setIsRunnerAuthenticated] = useState(false);

      const [authModalMode, setAuthModalMode] = useState(null); // null | "admin" | "runner"
      const [passInput, setPassInput] = useState("");
      const [authError, setAuthError] = useState("");

      const baseUrl = window.location.origin;

      // URL Query param handling (?view=admin or ?view=runner)
      useEffect(() => {
        const params = new URLSearchParams(window.location.search);
        const reqView = params.get("view") || window.location.pathname.replace("/", "");
        if (reqView === "admin") {
          if (!isAdminAuthenticated) setAuthModalMode("admin");
          else setCurrentView("admin");
        } else if (reqView === "runner") {
          if (!isRunnerAuthenticated) setAuthModalMode("runner");
          else setCurrentView("runner");
        }
      }, []);

      const handleUnlockAttempt = (e) => {
        e.preventDefault();
        if (authModalMode === "admin") {
          const expectedPass = localStorage.getItem("dg_admin_password") || "@Elijah16";
          if (passInput === expectedPass) {
            setIsAdminAuthenticated(true);
            setCurrentView("admin");
            setAuthModalMode(null);
            setPassInput("");
            setAuthError("");
          } else {
            setAuthError("Incorrect Admin password. Default is @Elijah16");
          }
        } else if (authModalMode === "runner") {
          const expectedPass = localStorage.getItem("dg_runner_password") || "@Elijah16";
          if (passInput === expectedPass) {
            setIsRunnerAuthenticated(true);
            setCurrentView("runner");
            setAuthModalMode(null);
            setPassInput("");
            setAuthError("");
          } else {
            setAuthError("Incorrect Runner passcode. Default is @Elijah16");
          }
        }
      };

      const handleExitToStorefront = () => {
        setCurrentView("storefront");
      };

      return (
        <div className="min-h-screen bg-slate-950 text-slate-100">
          {/* View Guarding */}
          {currentView === "storefront" && (
            <ResidentStorefront
              onOpenRunnerLogin={() => { setPassInput(""); setAuthError(""); setAuthModalMode("runner"); }}
              onOpenAdminLogin={() => { setPassInput(""); setAuthError(""); setAuthModalMode("admin"); }}
            />
          )}

          {currentView === "runner" && (
            isAdminAuthenticated || isRunnerAuthenticated ? (
              <RunnerDashboard onExit={handleExitToStorefront} />
            ) : (
              <ResidentStorefront
                onOpenRunnerLogin={() => { setPassInput(""); setAuthError(""); setAuthModalMode("runner"); }}
                onOpenAdminLogin={() => { setPassInput(""); setAuthError(""); setAuthModalMode("admin"); }}
              />
            )
          )}

          {currentView === "admin" && (
            isAdminAuthenticated ? (
              <AdminHub onExit={handleExitToStorefront} />
            ) : (
              <ResidentStorefront
                onOpenRunnerLogin={() => { setPassInput(""); setAuthError(""); setAuthModalMode("runner"); }}
                onOpenAdminLogin={() => { setPassInput(""); setAuthError(""); setAuthModalMode("admin"); }}
              />
            )
          )}

          {/* Protected Password Login Modal */}
          {authModalMode !== null && (
            <div className="fixed inset-0 z-50 bg-black/85 backdrop-blur-md flex items-center justify-center p-4">
              <form onSubmit={handleUnlockAttempt} className="bg-slate-900 border border-slate-800 p-6 rounded-3xl max-w-sm w-full space-y-4 shadow-2xl">
                <div className="text-center">
                  <div className={`w-12 h-12 rounded-2xl flex items-center justify-center mx-auto text-xl font-bold mb-2 border ${
                    authModalMode === "admin" ? "bg-violet-500/20 text-violet-300 border-violet-500/30" : "bg-emerald-500/20 text-emerald-400 border-emerald-500/30"
                  }`}>
                    {authModalMode === "admin" ? "🔑" : "🏃‍♂️"}
                  </div>
                  <h3 className="text-lg font-black text-white">
                    {authModalMode === "admin" ? "Admin Control Hub Access" : "Runner Dispatch Hub Access"}
                  </h3>
                  <p className="text-xs text-slate-400">
                    {authModalMode === "admin" ? "Enter Admin Password to unlock operations" : "Enter Runner Passcode to unlock lift dispatches"}
                  </p>
                </div>

                {authError && (
                  <div className="p-2.5 bg-rose-500/10 border border-rose-500/30 text-rose-400 text-xs font-bold rounded-xl text-center">
                    {authError}
                  </div>
                )}

                <div>
                  <label className="block text-xs font-bold text-slate-400 mb-1">
                    {authModalMode === "admin" ? "Admin Password" : "Runner Passcode"}
                  </label>
                  <input
                    type="password"
                    placeholder="Enter password"
                    value={passInput}
                    onChange={e => setPassInput(e.target.value)}
                    autoFocus
                    className="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-white text-sm outline-none font-bold"
                  />
                </div>

                <div className="flex gap-2">
                  <button
                    type="button"
                    onClick={() => { setAuthModalMode(null); setPassInput(""); setAuthError(""); }}
                    className="flex-1 bg-slate-800 text-slate-300 font-bold py-3 rounded-xl text-xs"
                  >
                    Cancel
                  </button>
                  <button
                    type="submit"
                    className={`flex-1 font-black py-3 rounded-xl text-xs transition ${
                      authModalMode === "admin" ? "bg-violet-600 hover:bg-violet-500 text-white" : "bg-emerald-500 hover:bg-emerald-400 text-slate-950"
                    }`}
                  >
                    Unlock
                  </button>
                </div>
              </form>
            </div>
          )}
        </div>
      );
    }

    // ---------------------------------------------------------------------------
    // 1. RESIDENT STOREFRONT VIEW
    // ---------------------------------------------------------------------------
    function ResidentStorefront({ onOpenRunnerLogin, onOpenAdminLogin }) {
      const [deliveryFee, setDeliveryFee] = useState(() => parseFloat(localStorage.getItem("dg_delivery_fee") || "1.99"));
      const [isStoreOpen, setIsStoreOpen] = useState(() => localStorage.getItem("dg_store_open") !== "false");
      const [announcement, setAnnouncement] = useState(() => localStorage.getItem("dg_banner_announcement") || "⚡ 10–15 minute door drops across South, East, West & North Towers.");
      const [accentColor, setAccentColor] = useState(() => localStorage.getItem("dg_theme_color") || "emerald");
      const [runnerWhatsApp, setRunnerWhatsApp] = useState(() => localStorage.getItem("dg_runner_phone") || "447123456789");

      const [storeItems, setStoreItems] = useState(() => {
        const saved = localStorage.getItem("dg_store_items");
        return saved ? JSON.parse(saved) : INITIAL_STORE_ITEMS;
      });

      const [cart, setCart] = useState({});
      const [selectedCategory, setSelectedCategory] = useState("All");
      const [tower, setTower] = useState("SOUTH");
      const [flatNumber, setFlatNumber] = useState("");
      const [customerPhone, setCustomerPhone] = useState("");
      const [deliveryNotes, setDeliveryNotes] = useState("");
      const [paymentMethod, setPaymentMethod] = useState("Monzo / Revolut Link");
      const [isCartOpen, setIsCartOpen] = useState(false);
      const [showQrModal, setShowQrModal] = useState(false);
      const [copyNotice, setCopyNotice] = useState("");

      // Live Active Customer Order Tracking State
      const [activeOrder, setActiveOrder] = useState(() => {
        const saved = localStorage.getItem("dg_active_resident_order");
        return saved ? JSON.parse(saved) : null;
      });
      const [showReceiptModal, setShowReceiptModal] = useState(false);

      const baseUrl = window.location.origin;

      const handleCopyStorefrontLink = () => {
        navigator.clipboard.writeText(baseUrl + "/storefront").then(() => {
          setCopyNotice("✓ Copied Storefront link!");
          setTimeout(() => setCopyNotice(""), 3000);
        });
      };

      // Instant synchronization across tabs & Admin updates
      useEffect(() => {
        const syncFromStorage = () => {
          const feeVal = parseFloat(localStorage.getItem("dg_delivery_fee") || "1.99");
          setDeliveryFee(feeVal);

          const openVal = localStorage.getItem("dg_store_open");
          if (openVal !== null) setIsStoreOpen(openVal === "true");

          const bannerVal = localStorage.getItem("dg_banner_announcement");
          if (bannerVal !== null) setAnnouncement(bannerVal);

          const colorVal = localStorage.getItem("dg_theme_color");
          if (colorVal) setAccentColor(colorVal);

          const phoneVal = localStorage.getItem("dg_runner_phone");
          if (phoneVal) setRunnerWhatsApp(phoneVal);

          const savedItems = localStorage.getItem("dg_store_items");
          if (savedItems) {
            try {
              setStoreItems(JSON.parse(savedItems));
            } catch (e) {}
          }

          // Check if active resident order status was updated
          const savedActive = localStorage.getItem("dg_active_resident_order");
          if (savedActive) {
            try {
              const parsedActive = JSON.parse(savedActive);
              const history = JSON.parse(localStorage.getItem("dg_orders_history") || "[]");
              const updatedFromHist = history.find(o => o.id === parsedActive.id);
              if (updatedFromHist) {
                setActiveOrder(updatedFromHist);
                localStorage.setItem("dg_active_resident_order", JSON.stringify(updatedFromHist));
              }
            } catch (e) {}
          }
        };

        syncFromStorage();

        // BroadcastChannel listener
        const channel = new BroadcastChannel("deansgate_ops_network");
        channel.onmessage = (event) => {
          if (event.data.type === "CONFIG_UPDATE" || event.data.type === "PRODUCTS_UPDATE") {
            syncFromStorage();
          } else if (event.data.type === "STATUS_UPDATE") {
            syncFromStorage();
          }
        };

        // Window storage event listener across tabs
        const handleStorageEvent = () => syncFromStorage();
        window.addEventListener("storage", handleStorageEvent);

        // 1s Interval polling
        const intervalId = setInterval(syncFromStorage, 1000);

        return () => {
          channel.close();
          window.removeEventListener("storage", handleStorageEvent);
          clearInterval(intervalId);
        };
      }, []);

      const categories = ["All", "Bakery", "Cold Drinks", "Beer & Wine", "Pantry", "Snacks", "Late Night"];

      const addToCart = (id) => {
        if (!isStoreOpen) {
          alert("Store operations are currently paused by management.");
          return;
        }
        setCart(prev => ({ ...prev, [id]: (prev[id] || 0) + 1 }));
      };

      const removeFromCart = (id) => setCart(prev => {
        const next = { ...prev };
        if (next[id] > 1) next[id] -= 1;
        else delete next[id];
        return next;
      });

      const totalCount = Object.values(cart).reduce((a, b) => a + b, 0);
      const subtotal = Object.entries(cart).reduce((sum, [id, qty]) => {
        const item = storeItems.find(i => i.id === Number(id));
        return sum + (item ? item.price * qty : 0);
      }, 0);
      const fee = totalCount > 0 ? deliveryFee : 0;
      const grandTotal = subtotal + fee;

      const detectedFloor = useMemo(() => {
        const cleaned = flatNumber.trim();
        if (cleaned.length === 3) return cleaned.slice(0, 1);
        if (cleaned.length >= 4) return cleaned.slice(0, 2);
        return null;
      }, [flatNumber]);

      // Complete Order Intake Handler (Supports both Direct Web Order and WhatsApp Dispatch)
      const handleSendOrder = (sendToWhatsApp = true) => {
        if (!isStoreOpen) {
          alert("Store is currently paused. Please try again when the store reopens.");
          return;
        }

        if (!flatNumber.trim()) {
          alert("Please enter your flat or apartment number.");
          return;
        }

        const orderCode = "DG-" + Math.floor(100 + Math.random() * 900);
        const orderData = {
          id: orderCode,
          tower,
          unit: flatNumber.trim(),
          floor: detectedFloor ? parseInt(detectedFloor) : 1,
          items: Object.entries(cart).map(([id, qty]) => {
            const item = storeItems.find(i => i.id === Number(id));
            return { name: item ? item.name : `Item #${id}`, qty, price: item ? item.price : 0 };
          }),
          subtotal,
          deliveryFee: fee,
          grandTotal,
          payment: paymentMethod,
          notes: deliveryNotes,
          phone: customerPhone,
          timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
          status: "ACCEPTED"
        };

        // Broadcast to live Ops Network (Admin + Runner)
        const channel = new BroadcastChannel("deansgate_ops_network");
        channel.postMessage({ type: "NEW_ORDER", order: orderData });

        // Save order to history and active resident order
        const existing = JSON.parse(localStorage.getItem("dg_orders_history") || "[]");
        localStorage.setItem("dg_orders_history", JSON.stringify([orderData, ...existing]));
        localStorage.setItem("dg_active_resident_order", JSON.stringify(orderData));
        setActiveOrder(orderData);

        // Clear cart and show confirmation modal
        setCart({});
        setIsCartOpen(false);
        setShowReceiptModal(true);

        if (sendToWhatsApp) {
          const lines = [
            `RB *NEW DEANSGATE SQUARE ORDER #${orderCode}*`,
            "━━━━━━━━━━━━━━━━━━━━",
            `📍 *Dropoff Address:*`,
            `• Tower: ${tower} Tower`,
            `• Flat: Flat ${flatNumber.trim()}${detectedFloor ? ` (Floor ~${detectedFloor})` : ""}`,
            customerPhone ? `• Phone: ${customerPhone}` : null,
            deliveryNotes ? `• Notes: ${deliveryNotes}` : null,
            "",
            "🛒 *Shopping List:*",
            ...orderData.items.map(it => `• ${it.qty}x ${it.name} - £${(it.price * it.qty).toFixed(2)}`),
            "",
            "━━━━━━━━━━━━━━━━━━━━",
            `📦 Items Subtotal: £${subtotal.toFixed(2)}`,
            `🛗 Vertical Lift Runner: £${fee.toFixed(2)}`,
            `💰 *Total Due: £${grandTotal.toFixed(2)}*`,
            `💳 Payment: ${paymentMethod}`,
            "━━━━━━━━━━━━━━━━━━━━",
            "⚡ *Ordered from Deansgate Square General Store*"
          ].filter(Boolean);

          const cleanNumber = runnerWhatsApp.replace(/[^0-9]/g, "");
          window.open(`https://wa.me/${cleanNumber}?text=${encodeURIComponent(lines.join("\n"))}`, "_blank");
        }
      };

      const primaryBg = accentColor === "amber" ? "bg-amber-500 hover:bg-amber-400" :
                        accentColor === "sky" ? "bg-sky-500 hover:bg-sky-400" :
                        accentColor === "rose" ? "bg-rose-500 hover:bg-rose-400" :
                        "bg-emerald-500 hover:bg-emerald-400";

      const primaryText = accentColor === "amber" ? "text-amber-400" :
                          accentColor === "sky" ? "text-sky-400" :
                          accentColor === "rose" ? "text-rose-400" :
                          "text-emerald-400";

      return (
        <div className="max-w-md mx-auto min-h-screen flex flex-col bg-slate-950 pb-36">
          {/* Header */}
          <header className="p-4 bg-slate-900/90 backdrop-blur sticky top-0 z-20 border-b border-slate-800 flex justify-between items-center">
            <div>
              <div className="flex items-center gap-2">
                <span className={`h-2.5 w-2.5 rounded-full ${isStoreOpen ? 'bg-emerald-400 animate-pulse' : 'bg-rose-500'}`}></span>
                <span className={`text-[11px] font-bold uppercase tracking-wider ${isStoreOpen ? primaryText : 'text-rose-400'}`}>
                  {isStoreOpen ? 'Open • Direct to Door' : 'Currently Paused'}
                </span>
              </div>
              <h1 className="text-lg font-black text-white">Deansgate Square Store</h1>
            </div>
            <div className="flex items-center gap-2">
              <button
                onClick={() => setShowQrModal(true)}
                className="p-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-violet-300 text-xs font-bold border border-slate-700"
                title="Scan or share Storefront link"
              >
                📱 QR Code
              </button>
              <span className="text-xs font-mono font-bold text-slate-300 bg-slate-950 px-2.5 py-1 rounded-xl border border-slate-800">
                Lift: £{deliveryFee.toFixed(2)}
              </span>
            </div>
          </header>

          {/* Announcement Banner */}
          {announcement && (
            <div className="px-4 py-2 bg-slate-900 border-b border-slate-850 text-xs text-slate-300">
              {announcement}
            </div>
          )}

          {/* Live Active Customer Order Banner */}
          {activeOrder && (
            <div
              onClick={() => setShowReceiptModal(true)}
              className="mx-4 mt-3 p-3 bg-gradient-to-r from-violet-900/80 to-slate-900 border border-violet-500/40 rounded-2xl flex justify-between items-center cursor-pointer shadow-lg active:scale-[0.99] transition"
            >
              <div className="flex items-center gap-2.5">
                <span className="text-xl animate-bounce">🛗</span>
                <div>
                  <div className="flex items-center gap-2">
                    <span className="text-xs font-mono font-bold text-violet-300">Order #{activeOrder.id}</span>
                    <span className={`px-2 py-0.5 rounded text-[10px] font-black uppercase ${
                      activeOrder.status === 'DELIVERED' ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30' :
                      activeOrder.status === 'PICKED_UP' ? 'bg-violet-500/20 text-violet-300 border border-violet-500/30' :
                      'bg-amber-500/20 text-amber-400 border border-amber-500/30'
                    }`}>
                      {activeOrder.status}
                    </span>
                  </div>
                  <p className="text-[11px] text-slate-300 font-medium">
                    {activeOrder.tower} Tower Flat {activeOrder.unit} • Tap to view receipt & track
                  </p>
                </div>
              </div>
              <span className="text-xs text-slate-400 font-bold">Track ➔</span>
            </div>
          )}

          {!isStoreOpen && (
            <div className="mx-4 mt-3 p-3 bg-rose-500/10 border border-rose-500/30 text-rose-400 text-xs font-bold rounded-2xl text-center">
              🚫 Orders are currently paused by Store Operations.
            </div>
          )}

          {/* Tower Selector */}
          <div className="p-4 bg-slate-900/40 border-b border-slate-800 mt-2">
            <span className="text-[11px] font-bold text-slate-400 uppercase tracking-wider block mb-2">Select Your Tower</span>
            <div className="grid grid-cols-4 gap-2">
              {TOWERS.map(t => (
                <button
                  key={t.id}
                  onClick={() => setTower(t.id)}
                  className={`py-2 px-1 rounded-xl text-center border transition ${
                    tower === t.id
                      ? 'border-white bg-slate-800 text-white font-black ring-1 ring-white/50'
                      : 'border-slate-800 bg-slate-900/60 text-slate-400'
                  }`}
                >
                  <div className="text-xs">{t.name}</div>
                  <div className="text-[10px] text-slate-500 font-normal">{t.floors} fl</div>
                </button>
              ))}
            </div>
          </div>

          {/* Category Filter */}
          <div className="flex gap-2 px-4 py-3 overflow-x-auto border-b border-slate-800 scrollbar-none">
            {categories.map(c => (
              <button
                key={c}
                onClick={() => setSelectedCategory(c)}
                className={`whitespace-nowrap px-3.5 py-1.5 rounded-xl text-xs font-bold transition ${
                  selectedCategory === c ? `${primaryBg} text-slate-950` : 'bg-slate-900 text-slate-400 border border-slate-800'
                }`}
              >
                {c}
              </button>
            ))}
          </div>

          {/* Store Items List */}
          <div className="p-4 space-y-3 flex-1">
            {storeItems.filter(i => selectedCategory === "All" || i.category === selectedCategory).map(item => {
              const qty = cart[item.id] || 0;
              return (
                <div key={item.id} className="p-3.5 bg-slate-900/90 rounded-2xl border border-slate-800/90 flex justify-between items-center gap-3">
                  {item.imageUrl && (
                    <img src={item.imageUrl} alt={item.name} className="w-12 h-12 object-cover rounded-xl border border-slate-800 flex-shrink-0" />
                  )}
                  <div className="flex-1 min-w-0 pr-2">
                    {item.badge && (
                      <span className="text-[10px] font-bold text-slate-400 bg-slate-800 px-2 py-0.5 rounded border border-slate-700">
                        {item.badge}
                      </span>
                    )}
                    <div className="font-bold text-white text-sm mt-1 truncate">{item.name}</div>
                    <div className="text-xs text-slate-400">{item.unit}</div>
                    <div className={`text-sm font-black mt-1 ${primaryText}`}>£{parseFloat(item.price).toFixed(2)}</div>
                  </div>
                  <div className="flex items-center bg-slate-950 rounded-xl border border-slate-800 p-1 flex-shrink-0">
                    {qty > 0 ? (
                      <>
                        <button onClick={() => removeFromCart(item.id)} className="w-8 h-8 bg-slate-800 rounded font-black text-white active:scale-90">-</button>
                        <span className="w-8 text-center text-xs font-black text-white">{qty}</span>
                        <button onClick={() => addToCart(item.id)} className={`w-8 h-8 rounded font-black text-slate-950 ${primaryBg} active:scale-90`}>+</button>
                      </>
                    ) : (
                      <button
                        onClick={() => addToCart(item.id)}
                        disabled={!isStoreOpen}
                        className={`px-3.5 py-1.5 ${isStoreOpen ? primaryBg : 'bg-slate-800 text-slate-500'} font-black text-xs rounded-lg active:scale-95 transition`}
                      >
                        {isStoreOpen ? '+ Add' : 'Paused'}
                      </button>
                    )}
                  </div>
                </div>
              );
            })}
          </div>

          {/* Staff Password Protected Access Footer */}
          <footer className="p-4 bg-slate-900/60 border-t border-slate-850/80 text-center space-y-2 mt-auto">
            <span className="text-[11px] font-bold text-slate-500 uppercase tracking-widest block">Concierge & Operations Access</span>
            <div className="flex justify-center gap-2">
              <button
                onClick={onOpenRunnerLogin}
                className="px-3.5 py-1.5 rounded-xl bg-slate-900 hover:bg-slate-800 text-emerald-400 text-xs font-bold border border-slate-800 transition"
              >
                🏃‍♂️ Runner Mode (Password)
              </button>
              <button
                onClick={onOpenAdminLogin}
                className="px-3.5 py-1.5 rounded-xl bg-slate-900 hover:bg-slate-800 text-violet-300 text-xs font-bold border border-slate-800 transition"
              >
                🔑 Admin Mode (Password)
              </button>
            </div>
          </footer>

          {/* Floating Cart Button */}
          {totalCount > 0 && (
            <div className="fixed bottom-0 left-0 right-0 p-4 max-w-md mx-auto z-30">
              <button
                onClick={() => setIsCartOpen(true)}
                className={`w-full ${primaryBg} text-slate-950 font-black p-4 rounded-2xl shadow-2xl flex justify-between items-center transition active:scale-[0.98]`}
              >
                <div className="flex items-center gap-2">
                  <span className="bg-slate-950 text-white text-xs px-2.5 py-1 rounded-full">{totalCount}</span>
                  <span>View Delivery Bag</span>
                </div>
                <span>£{grandTotal.toFixed(2)}</span>
              </button>
            </div>
          )}

          {/* Checkout Bag Drawer */}
          {isCartOpen && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex flex-col justify-end max-w-md mx-auto">
              <div className="bg-slate-900 rounded-t-3xl border-t border-slate-800 p-4 space-y-4 max-h-[85vh] overflow-y-auto">
                <div className="flex justify-between items-center">
                  <div>
                    <h3 className="font-black text-white text-lg">{tower} Tower Delivery</h3>
                    <p className="text-xs text-slate-400">Straight to your apartment door</p>
                  </div>
                  <button onClick={() => setIsCartOpen(false)} className="w-8 h-8 rounded-full bg-slate-800 text-slate-300 font-bold">✕</button>
                </div>

                <div className="space-y-2 bg-slate-950 p-3.5 rounded-2xl border border-slate-800 text-xs">
                  <div>
                    <label className="block text-slate-400 font-bold mb-1">Apartment Number *</label>
                    <input
                      type="text"
                      placeholder="e.g. 3402"
                      value={flatNumber}
                      onChange={e => setFlatNumber(e.target.value)}
                      className="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-white outline-none font-bold"
                    />
                  </div>
                  <div>
                    <label className="block text-slate-400 font-bold mb-1">Mobile Phone (Optional)</label>
                    <input
                      type="tel"
                      placeholder="For dropoff call/SMS"
                      value={customerPhone}
                      onChange={e => setCustomerPhone(e.target.value)}
                      className="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-white outline-none"
                    />
                  </div>
                  <div>
                    <label className="block text-slate-400 font-bold mb-1">Door Notes</label>
                    <input
                      type="text"
                      placeholder="e.g. Leave at door if no answer"
                      value={deliveryNotes}
                      onChange={e => setDeliveryNotes(e.target.value)}
                      className="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-white outline-none"
                    />
                  </div>
                  <div>
                    <label className="block text-slate-400 font-bold mb-1">Payment Method</label>
                    <select
                      value={paymentMethod}
                      onChange={e => setPaymentMethod(e.target.value)}
                      className="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-white outline-none font-bold"
                    >
                      <option value="Monzo / Revolut Link">Monzo / Revolut Link</option>
                      <option value="Instant Bank Transfer">Instant Bank Transfer</option>
                      <option value="Card Payment at Door">Card Payment at Door</option>
                      <option value="Cash on Delivery">Cash on Delivery</option>
                    </select>
                  </div>
                </div>

                <div className="bg-slate-950 p-3.5 rounded-2xl border border-slate-800 text-xs space-y-1">
                  <div className="flex justify-between text-slate-400"><span>Items Subtotal</span><span>£{subtotal.toFixed(2)}</span></div>
                  <div className="flex justify-between text-slate-400"><span>Lift Runner Drop Fee</span><span>£{fee.toFixed(2)}</span></div>
                  <div className="flex justify-between text-white font-black text-sm pt-1 border-t border-slate-800"><span>Total Due</span><span className={primaryText}>£{grandTotal.toFixed(2)}</span></div>
                </div>

                <div className="space-y-2">
                  <button
                    onClick={() => handleSendOrder(false)}
                    className="w-full bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black p-3.5 rounded-2xl text-center shadow-xl active:scale-[0.98] transition text-sm flex items-center justify-center gap-2"
                  >
                    <span>⚡</span>
                    <span>Place Order Direct on Web</span>
                  </button>
                  <button
                    onClick={() => handleSendOrder(true)}
                    className="w-full bg-slate-800 hover:bg-slate-700 text-white font-bold p-3 rounded-2xl text-center border border-slate-700 active:scale-[0.98] transition text-xs flex items-center justify-center gap-2"
                  >
                    <span>💬</span>
                    <span>Send Order via WhatsApp</span>
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Live Order Confirmation & Status Receipt Modal */}
          {showReceiptModal && activeOrder && (
            <div className="fixed inset-0 z-50 bg-black/85 backdrop-blur-md flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-800 p-6 rounded-3xl max-w-sm w-full space-y-4 text-center shadow-2xl">
                <div className="w-14 h-14 bg-emerald-500/20 text-emerald-400 rounded-3xl flex items-center justify-center mx-auto text-2xl border border-emerald-500/30">
                  🎉
                </div>

                <div>
                  <span className="text-xs font-mono font-bold text-violet-300 uppercase">Order Confirmed #{activeOrder.id}</span>
                  <h3 className="text-lg font-black text-white mt-1">Thank you for your order!</h3>
                  <p className="text-xs text-slate-400 mt-0.5">Delivering to {activeOrder.tower} Tower Flat {activeOrder.unit}</p>
                </div>

                {/* Live Status Progression */}
                <div className="bg-slate-950 p-3.5 rounded-2xl border border-slate-800 text-xs space-y-2 text-left">
                  <span className="text-[10px] font-bold text-slate-400 uppercase block">Live Delivery Status</span>
                  <div className="flex items-center justify-between font-bold">
                    <span className={`px-2.5 py-1 rounded-lg text-xs uppercase ${
                      activeOrder.status === 'DELIVERED' ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30' :
                      activeOrder.status === 'PICKED_UP' ? 'bg-violet-500/20 text-violet-300 border border-violet-500/30' :
                      'bg-amber-500/20 text-amber-400 border border-amber-500/30'
                    }`}>
                      {activeOrder.status}
                    </span>
                    <span className="text-slate-400 font-mono text-[11px]">{activeOrder.timestamp}</span>
                  </div>

                  {/* Itemized List */}
                  <div className="pt-2 border-t border-slate-850 space-y-1">
                    {activeOrder.items?.map((it, idx) => (
                      <div key={idx} className="flex justify-between text-slate-300">
                        <span>{it.qty}x {it.name}</span>
                        <span>£{(it.price * it.qty).toFixed(2)}</span>
                      </div>
                    ))}
                    <div className="flex justify-between font-bold text-white pt-1 border-t border-slate-850">
                      <span>Total Due</span>
                      <span className="text-emerald-400">£{(activeOrder.grandTotal || 0).toFixed(2)}</span>
                    </div>
                  </div>
                </div>

                <button
                  onClick={() => setShowReceiptModal(false)}
                  className="w-full bg-slate-800 hover:bg-slate-700 text-white font-bold py-3 rounded-2xl text-xs transition"
                >
                  Done
                </button>
              </div>
            </div>
          )}

          {/* QR Code Modal */}
          {showQrModal && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-800 p-6 rounded-3xl max-w-sm w-full space-y-4 text-center">
                <div className="flex justify-between items-center">
                  <h3 className="text-white font-black text-base">Storefront App QR Code 🛍️</h3>
                  <button onClick={() => setShowQrModal(false)} className="w-8 h-8 rounded-full bg-slate-800 text-slate-300 font-bold">✕</button>
                </div>

                <div className="bg-white p-3 rounded-2xl shadow-xl inline-block border border-slate-700">
                  <img
                    src={`https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=${encodeURIComponent(baseUrl + '/storefront')}`}
                    alt="Storefront App QR Code"
                    className="w-44 h-44 rounded-xl"
                  />
                </div>

                <div className="text-xs font-mono text-violet-300 bg-slate-950 p-2.5 rounded-xl border border-slate-800 break-all">
                  {baseUrl}/storefront
                </div>

                {copyNotice && <div className="text-xs font-bold text-emerald-400">{copyNotice}</div>}

                <div className="flex gap-2">
                  <button onClick={handleCopyStorefrontLink} className="flex-1 bg-violet-600 text-white font-black py-2.5 rounded-xl text-xs">
                    📋 Copy Storefront Link
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<DeansgateApp />);
  </script>
</body>
</html>
