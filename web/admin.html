<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Deansgate Square | Admin Command Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>body { -webkit-tap-highlight-color: transparent; }</style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen antialiased selection:bg-slate-800">
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect } = React;

    const INITIAL_STORE_ITEMS = [
      { id: 1, name: "Sourdough Baguette", category: "Bakery", price: 2.80, unit: "Freshly Baked", badge: "Morning Fresh", imageUrl: "" },
      { id: 2, name: "Almond Croissant", category: "Bakery", price: 3.40, unit: "Artisan Pastry", badge: "Popular", imageUrl: "" },
      { id: 3, name: "Pain au Chocolat", category: "Bakery", price: 3.10, unit: "Warm Bakery", badge: "Fresh Daily", imageUrl: "" },
      { id: 4, name: "Organic Whole Milk", category: "Pantry", price: 1.95, unit: "1 Litre", badge: "Staple", imageUrl: "" },
      { id: 5, name: "Oat Milk (Barista)", category: "Pantry", price: 2.30, unit: "1 Litre", badge: "Vegan", imageUrl: "" },
      { id: 6, name: "Free Range Eggs (6pk)", category: "Pantry", price: 2.75, unit: "Half Dozen", badge: "Organic", imageUrl: "" },
      { id: 7, name: "San Pellegrino Lemon", category: "Cold Drinks", price: 1.80, unit: "330ml Can", badge: "Chilled", imageUrl: "" },
      { id: 8, name: "Diet Coke Can", category: "Cold Drinks", price: 1.50, unit: "330ml Can", badge: "Chilled", imageUrl: "" },
      { id: 9, name: "Fresh Orange Juice", category: "Cold Drinks", price: 3.20, unit: "500ml Chilled", badge: "Cold Pressed", imageUrl: "" },
      { id: 10, name: "Cloudwater Fuzzy IPA", category: "Beer & Wine", price: 4.50, unit: "440ml Craft Can", badge: "Local Brew", imageUrl: "" },
      { id: 11, name: "Miraval Côtes de Provence Rosé", category: "Beer & Wine", price: 19.50, unit: "750ml Bottle", badge: "Chilled", imageUrl: "" },
      { id: 12, name: "Peroni Nastro Azzurro (4pk)", category: "Beer & Wine", price: 7.50, unit: "4 x 330ml", badge: "Chilled", imageUrl: "" },
      { id: 13, name: "Proper Chips Sea Salt", category: "Snacks", price: 1.75, unit: "85g Bag", badge: "Vegan", imageUrl: "" },
      { id: 14, name: "Salted Caramel Gelato", category: "Snacks", price: 5.40, unit: "500ml Tub", badge: "Freezer", imageUrl: "" },
      { id: 15, name: "Tony's Chocolonely Caramel", category: "Snacks", price: 3.85, unit: "180g Bar", badge: "Fairtrade", imageUrl: "" },
      { id: 16, name: "Hayati Pro Ultra Pod Refill", category: "Late Night", price: 9.99, unit: "Pack of 2", badge: "18+ ID Req", imageUrl: "" },
      { id: 17, name: "Paracetamol Extra (16pk)", category: "Late Night", price: 1.80, unit: "Box of 16", badge: "Pharmacy", imageUrl: "" }
    ];

    function AdminHub() {
      const [feePounds, setFeePounds] = useState(() => localStorage.getItem("dg_delivery_fee") || "1.50");
      const [isOpen, setIsOpen] = useState(true);
      const [banner, setBanner] = useState("⚡ 10–15 minute door drops across all 4 towers.");
      const [themeColor, setThemeColor] = useState(() => localStorage.getItem("dg_theme_color") || "violet");
      const [runnerPhone, setRunnerPhone] = useState(() => localStorage.getItem("dg_runner_phone") || "447123456789");

      // Passwords
      const [adminPassword, setAdminPassword] = useState(() => localStorage.getItem("dg_admin_password") || "@Elijah16");
      const [runnerPassword, setRunnerPassword] = useState(() => localStorage.getItem("dg_runner_password") || "@Elijah16");

      // Password Modals
      const [showAdminPassModal, setShowAdminPassModal] = useState(false);
      const [showRunnerPassModal, setShowRunnerPassModal] = useState(false);
      const [newPass, setNewPass] = useState("");
      const [confirmPass, setConfirmPass] = useState("");
      const [passError, setPassError] = useState("");

      // Products Catalog State
      const [products, setProducts] = useState(() => {
        const saved = localStorage.getItem("dg_store_items");
        return saved ? JSON.parse(saved) : INITIAL_STORE_ITEMS;
      });
      const [showProductModal, setShowProductModal] = useState(false);
      const [editingProduct, setEditingProduct] = useState(null);
      const [prodName, setProdName] = useState("");
      const [prodCategory, setProdCategory] = useState("Bakery");
      const [prodPrice, setProdPrice] = useState("2.50");
      const [prodUnit, setProdUnit] = useState("Standard Item");
      const [prodBadge, setProdBadge] = useState("In Stock");
      const [prodImage, setProdImage] = useState("");

      const [orders, setOrders] = useState(() => {
        const saved = localStorage.getItem("dg_orders_history");
        return saved ? JSON.parse(saved) : [];
      });
      const [saveNotice, setSaveNotice] = useState("");
      const [copyNotice, setCopyNotice] = useState("");

      const baseUrl = window.location.origin;

      const handleCopyLink = (url, name) => {
        navigator.clipboard.writeText(url).then(() => {
          setCopyNotice(`✓ Copied ${name} link to clipboard!`);
          setTimeout(() => setCopyNotice(""), 3000);
        });
      };

      const saveAndBroadcastProducts = (updatedProducts) => {
        setProducts(updatedProducts);
        localStorage.setItem("dg_store_items", JSON.stringify(updatedProducts));
        const channel = new BroadcastChannel("deansgate_ops_network");
        channel.postMessage({ type: "PRODUCTS_UPDATE", items: updatedProducts });
        setSaveNotice("✓ Updated product catalog & broadcasted to storefront!");
        setTimeout(() => setSaveNotice(""), 3500);
      };

      const broadcastConfig = (newFee, newIsOpen, newBanner, newColor, newPhone, newAdminP, newRunnerP) => {
        const feeNum = parseFloat(newFee) || 1.50;
        localStorage.setItem("dg_delivery_fee", feeNum.toString());
        localStorage.setItem("dg_theme_color", newColor);
        localStorage.setItem("dg_runner_phone", newPhone);
        if (newAdminP) localStorage.setItem("dg_admin_password", newAdminP);
        if (newRunnerP) localStorage.setItem("dg_runner_password", newRunnerP);

        const channel = new BroadcastChannel("deansgate_ops_network");
        channel.postMessage({
          type: "CONFIG_UPDATE",
          deliveryFee: feeNum,
          isOpen: newIsOpen,
          announcement: newBanner,
          color: newColor,
          runnerPhone: newPhone,
          adminPassword: newAdminP || adminPassword,
          runnerPassword: newRunnerP || runnerPassword
        });

        setSaveNotice("✓ Saved & broadcasted across all operational hubs!");
        setTimeout(() => setSaveNotice(""), 3500);
      };

      useEffect(() => {
        const channel = new BroadcastChannel("deansgate_ops_network");
        channel.onmessage = (event) => {
          if (event.data.type === "NEW_ORDER") {
            setOrders(prev => [event.data.order, ...prev]);
          } else if (event.data.type === "STATUS_UPDATE") {
            setOrders(prev => prev.map(o => o.id === event.data.orderId ? { ...o, status: event.data.status } : o));
          }
        };
        return () => channel.close();
      }, []);

      const handleChangeAdminPass = () => {
        if (!newPass || newPass !== confirmPass) {
          setPassError("Passwords do not match or are empty.");
          return;
        }
        if (newPass.length < 4) {
          setPassError("Password must be at least 4 characters.");
          return;
        }
        setAdminPassword(newPass);
        localStorage.setItem("dg_admin_password", newPass);
        broadcastConfig(feePounds, isOpen, banner, themeColor, runnerPhone, newPass, runnerPassword);
        setShowAdminPassModal(false);
        setNewPass(""); setConfirmPass(""); setPassError("");
      };

      const handleChangeRunnerPass = () => {
        if (!newPass || newPass !== confirmPass) {
          setPassError("Passwords do not match or are empty.");
          return;
        }
        if (newPass.length < 4) {
          setPassError("Password must be at least 4 characters.");
          return;
        }
        setRunnerPassword(newPass);
        localStorage.setItem("dg_runner_password", newPass);
        broadcastConfig(feePounds, isOpen, banner, themeColor, runnerPhone, adminPassword, newPass);
        setShowRunnerPassModal(false);
        setNewPass(""); setConfirmPass(""); setPassError("");
      };

      const handleOpenAddProduct = () => {
        setEditingProduct(null);
        setProdName("");
        setProdCategory("Bakery");
        setProdPrice("2.50");
        setProdUnit("Standard Item");
        setProdBadge("In Stock");
        setProdImage("");
        setShowProductModal(true);
      };

      const handleOpenEditProduct = (p) => {
        setEditingProduct(p);
        setProdName(p.name);
        setProdCategory(p.category || "General");
        setProdPrice(p.price ? p.price.toString() : "0.00");
        setProdUnit(p.unit || "");
        setProdBadge(p.badge || "In Stock");
        setProdImage(p.imageUrl || "");
        setShowProductModal(true);
      };

      const handleSaveProduct = () => {
        if (!prodName.trim()) return;
        const priceNum = parseFloat(prodPrice) || 0;

        if (editingProduct) {
          const updated = products.map(p => p.id === editingProduct.id ? {
            ...p,
            name: prodName.trim(),
            category: prodCategory,
            price: priceNum,
            unit: prodUnit,
            badge: prodBadge,
            imageUrl: prodImage.trim()
          } : p);
          saveAndBroadcastProducts(updated);
        } else {
          const newId = Date.now();
          const newP = {
            id: newId,
            name: prodName.trim(),
            category: prodCategory,
            price: priceNum,
            unit: prodUnit,
            badge: prodBadge,
            imageUrl: prodImage.trim()
          };
          saveAndBroadcastProducts([newP, ...products]);
        }

        setShowProductModal(false);
      };

      const handleDeleteProduct = (id) => {
        if (confirm("Are you sure you want to delete this product?")) {
          const updated = products.filter(p => p.id !== id);
          saveAndBroadcastProducts(updated);
        }
      };

      const totalRevenue = orders.reduce((sum, o) => sum + (o.grandTotal || 0), 0);
      const activeRuns = orders.filter(o => o.status !== 'DELIVERED').length;

      return (
        <div className="max-w-4xl mx-auto p-4 sm:p-6 space-y-6">
          <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 border-b border-slate-800 pb-5">
            <div>
              <div className="flex items-center gap-2">
                <span className="h-2.5 w-2.5 rounded-full bg-emerald-400 animate-pulse"></span>
                <span className="text-xs font-mono font-bold tracking-widest uppercase text-emerald-400">Live Operations Hub</span>
              </div>
              <h1 className="text-2xl font-black text-white mt-1">Deansgate Command Center</h1>
            </div>
            <div className="flex gap-2">
              <a href="runner.html" target="_blank" className="px-3 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-xs font-bold text-emerald-400 border border-slate-700 transition">
                🛗 Open Runner Hub ↗
              </a>
              <a href="index.html" target="_blank" className="px-3 py-1.5 rounded-xl bg-violet-600/30 text-violet-300 hover:bg-violet-600/40 text-xs font-bold border border-violet-500/30 transition">
                🛍️ Open Storefront ↗
              </a>
            </div>
          </div>

          <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
            <div className="bg-slate-900 p-4 rounded-2xl border border-slate-800">
              <span className="text-[11px] font-bold text-slate-400 uppercase block">Active In-Lift Runs</span>
              <span className="text-2xl font-black text-amber-400 mt-1 block">{activeRuns}</span>
            </div>
            <div className="bg-slate-900 p-4 rounded-2xl border border-slate-800">
              <span className="text-[11px] font-bold text-slate-400 uppercase block">Total Orders</span>
              <span className="text-2xl font-black text-white mt-1 block">{orders.length}</span>
            </div>
            <div className="bg-slate-900 p-4 rounded-2xl border border-slate-800">
              <span className="text-[11px] font-bold text-slate-400 uppercase block">Gross Volume</span>
              <span className="text-2xl font-black text-emerald-400 mt-1 block">£{totalRevenue.toFixed(2)}</span>
            </div>
            <div className="bg-slate-900 p-4 rounded-2xl border border-slate-800">
              <span className="text-[11px] font-bold text-slate-400 uppercase block">Catalog Items</span>
              <span className="text-2xl font-black text-violet-400 mt-1 block">{products.length}</span>
            </div>
          </div>

          {/* Netlify Links & QR Codes Section */}
          <div className="bg-slate-900 p-5 rounded-2xl border border-slate-800 space-y-4">
            <div className="flex justify-between items-center border-b border-slate-800 pb-3">
              <div>
                <h2 className="text-sm font-bold text-white uppercase tracking-wider">📱 App Links & Scannable QR Codes</h2>
                <p className="text-xs text-slate-400">Share direct Netlify portal addresses or scan QR codes with phone camera</p>
              </div>
              {copyNotice && (
                <span className="text-xs font-bold text-emerald-400 bg-emerald-950/60 border border-emerald-800/60 px-3 py-1 rounded-xl">
                  {copyNotice}
                </span>
              )}
            </div>

            <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
              {/* Portal 1: Storefront */}
              <div className="bg-slate-950 p-4 rounded-2xl border border-slate-800/90 flex flex-col items-center text-center space-y-3">
                <div className="flex items-center gap-1.5">
                  <span className="text-lg">🛍️</span>
                  <span className="font-bold text-white text-sm">Resident Storefront</span>
                </div>
                <div className="bg-white p-2 rounded-2xl shadow-lg border border-slate-700">
                  <img
                    src={`https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=${encodeURIComponent(baseUrl + '/storefront')}`}
                    alt="Storefront QR Code"
                    className="w-36 h-36 rounded-xl"
                  />
                </div>
                <div className="text-[11px] font-mono text-violet-300 break-all bg-slate-900 px-2.5 py-1 rounded-lg border border-slate-800 w-full">
                  {baseUrl}/storefront
                </div>
                <div className="flex gap-2 w-full">
                  <button
                    onClick={() => handleCopyLink(baseUrl + '/storefront', 'Storefront')}
                    className="flex-1 py-1.5 bg-slate-800 hover:bg-slate-700 text-white rounded-xl text-xs font-bold border border-slate-700 transition"
                  >
                    📋 Copy
                  </button>
                  <a
                    href={`${baseUrl}/storefront`}
                    target="_blank"
                    className="flex-1 py-1.5 bg-violet-600/30 hover:bg-violet-600/50 text-violet-300 rounded-xl text-xs font-bold border border-violet-500/30 text-center transition"
                  >
                    Open ↗
                  </a>
                </div>
              </div>

              {/* Portal 2: Runner */}
              <div className="bg-slate-950 p-4 rounded-2xl border border-slate-800/90 flex flex-col items-center text-center space-y-3">
                <div className="flex items-center gap-1.5">
                  <span className="text-lg">🏃‍♂️</span>
                  <span className="font-bold text-white text-sm">Runner Dispatch Hub</span>
                </div>
                <div className="bg-white p-2 rounded-2xl shadow-lg border border-slate-700">
                  <img
                    src={`https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=${encodeURIComponent(baseUrl + '/runner')}`}
                    alt="Runner QR Code"
                    className="w-36 h-36 rounded-xl"
                  />
                </div>
                <div className="text-[11px] font-mono text-emerald-400 break-all bg-slate-900 px-2.5 py-1 rounded-lg border border-slate-800 w-full">
                  {baseUrl}/runner
                </div>
                <div className="flex gap-2 w-full">
                  <button
                    onClick={() => handleCopyLink(baseUrl + '/runner', 'Runner')}
                    className="flex-1 py-1.5 bg-slate-800 hover:bg-slate-700 text-white rounded-xl text-xs font-bold border border-slate-700 transition"
                  >
                    📋 Copy
                  </button>
                  <a
                    href={`${baseUrl}/runner`}
                    target="_blank"
                    className="flex-1 py-1.5 bg-emerald-500/20 hover:bg-emerald-500/30 text-emerald-400 rounded-xl text-xs font-bold border border-emerald-500/30 text-center transition"
                  >
                    Open ↗
                  </a>
                </div>
              </div>

              {/* Portal 3: Admin */}
              <div className="bg-slate-950 p-4 rounded-2xl border border-slate-800/90 flex flex-col items-center text-center space-y-3">
                <div className="flex items-center gap-1.5">
                  <span className="text-lg">🔑</span>
                  <span className="font-bold text-white text-sm">Admin Command Hub</span>
                </div>
                <div className="bg-white p-2 rounded-2xl shadow-lg border border-slate-700">
                  <img
                    src={`https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=${encodeURIComponent(baseUrl + '/admin')}`}
                    alt="Admin QR Code"
                    className="w-36 h-36 rounded-xl"
                  />
                </div>
                <div className="text-[11px] font-mono text-amber-300 break-all bg-slate-900 px-2.5 py-1 rounded-lg border border-slate-800 w-full">
                  {baseUrl}/admin
                </div>
                <div className="flex gap-2 w-full">
                  <button
                    onClick={() => handleCopyLink(baseUrl + '/admin', 'Admin')}
                    className="w-full py-1.5 bg-slate-800 hover:bg-slate-700 text-white rounded-xl text-xs font-bold border border-slate-700 transition"
                  >
                    📋 Copy Admin Link
                  </button>
                </div>
              </div>
            </div>
          </div>

          {/* Quick Security & Passwords Bar */}
          <div className="bg-slate-900 p-4 rounded-2xl border border-slate-800 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
            <div>
              <span className="text-xs font-bold text-slate-400 uppercase tracking-wider">Access Security & Passcodes</span>
              <div className="text-xs text-slate-300 mt-1">
                Admin Pass: <code className="bg-slate-950 px-2 py-0.5 rounded text-violet-400 font-mono font-bold">{adminPassword}</code> • Runner Pass: <code className="bg-slate-950 px-2 py-0.5 rounded text-emerald-400 font-mono font-bold">{runnerPassword}</code>
              </div>
            </div>
            <div className="flex gap-2 w-full sm:w-auto">
              <button
                onClick={() => { setShowAdminPassModal(true); setPassError(""); setNewPass(""); setConfirmPass(""); }}
                className="flex-1 sm:flex-initial px-3 py-2 rounded-xl bg-violet-600/20 hover:bg-violet-600/30 text-violet-300 text-xs font-bold border border-violet-500/30"
              >
                🔑 Admin Pass
              </button>
              <button
                onClick={() => { setShowRunnerPassModal(true); setPassError(""); setNewPass(""); setConfirmPass(""); }}
                className="flex-1 sm:flex-initial px-3 py-2 rounded-xl bg-emerald-500/20 hover:bg-emerald-500/30 text-emerald-400 text-xs font-bold border border-emerald-500/30"
              >
                🏃‍♂️ Runner Pass
              </button>
            </div>
          </div>

          {/* Store Operations Settings */}
          <div className="bg-slate-900 p-5 rounded-2xl border border-slate-800 space-y-4">
            <h2 className="text-sm font-bold text-white uppercase tracking-wider">Store Operations Settings</h2>

            <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
              <div>
                <label className="block text-xs text-slate-400 font-bold mb-1">Vertical Lift Drop Fee (£)</label>
                <input
                  type="number"
                  step="0.10"
                  value={feePounds}
                  onChange={(e) => setFeePounds(e.target.value)}
                  className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-white text-sm outline-none font-mono"
                />
              </div>

              <div>
                <label className="block text-xs text-slate-400 font-bold mb-1">Runner WhatsApp Phone</label>
                <input
                  type="text"
                  value={runnerPhone}
                  onChange={(e) => setRunnerPhone(e.target.value)}
                  className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-white text-sm outline-none font-mono"
                />
              </div>
            </div>

            <div>
              <label className="block text-xs text-slate-400 font-bold mb-1">Resident Banner Announcement</label>
              <input
                type="text"
                value={banner}
                onChange={(e) => setBanner(e.target.value)}
                className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-white text-sm outline-none"
              />
            </div>

            <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 pt-2">
              <div className="flex items-center gap-3">
                <button
                  onClick={() => setIsOpen(!isOpen)}
                  className={`px-4 py-2 rounded-xl text-xs font-black transition ${
                    isOpen ? 'bg-emerald-500 text-slate-950' : 'bg-rose-500 text-white'
                  }`}
                >
                  {isOpen ? 'Store Active (Open)' : 'Store Paused (Closed)'}
                </button>
                <span className="text-xs text-slate-400">Controls resident order intake</span>
              </div>

              <button
                onClick={() => broadcastConfig(feePounds, isOpen, banner, themeColor, runnerPhone, adminPassword, runnerPassword)}
                className="w-full sm:w-auto bg-violet-600 hover:bg-violet-500 text-white font-bold text-xs px-5 py-2.5 rounded-xl shadow-lg transition active:scale-95"
              >
                Broadcast Settings
              </button>
            </div>

            {saveNotice && (
              <div className="p-3 bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 text-xs font-bold rounded-xl text-center">
                {saveNotice}
              </div>
            )}
          </div>

          {/* Products & Pricing Manager */}
          <div className="bg-slate-900 p-5 rounded-2xl border border-slate-800 space-y-4">
            <div className="flex justify-between items-center border-b border-slate-800 pb-3">
              <div>
                <h2 className="text-sm font-bold text-white uppercase tracking-wider">Products, Prices & Images Catalog</h2>
                <p className="text-xs text-slate-400">Change prices, titles, images, and stock for the Storefront</p>
              </div>
              <button
                onClick={handleOpenAddProduct}
                className="px-4 py-2 rounded-xl bg-emerald-500 text-slate-950 font-black text-xs hover:bg-emerald-400 transition"
              >
                + Add Product
              </button>
            </div>

            <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
              {products.map(p => (
                <div key={p.id} className="p-3.5 bg-slate-950 rounded-2xl border border-slate-800 flex justify-between items-start gap-2">
                  {p.imageUrl && (
                    <img src={p.imageUrl} alt={p.name} className="w-12 h-12 object-cover rounded-xl border border-slate-800 flex-shrink-0" />
                  )}
                  <div className="flex-1 min-w-0">
                    <div className="flex items-center gap-2">
                      <span className="text-[10px] font-bold text-violet-400 bg-violet-950/60 px-2 py-0.5 rounded border border-violet-800/50">{p.category}</span>
                      {p.badge && <span className="text-[10px] font-bold text-amber-400 bg-amber-950/60 px-2 py-0.5 rounded border border-amber-800/50">{p.badge}</span>}
                    </div>
                    <div className="font-bold text-white text-sm mt-1 truncate">{p.name}</div>
                    <div className="text-xs text-slate-400">{p.unit}</div>
                    <div className="text-sm font-black text-emerald-400 mt-1">£{parseFloat(p.price).toFixed(2)}</div>
                  </div>
                  <div className="flex flex-col gap-1.5 flex-shrink-0">
                    <button
                      onClick={() => handleOpenEditProduct(p)}
                      className="px-2.5 py-1 bg-slate-800 hover:bg-slate-700 text-violet-300 rounded-lg text-xs font-bold border border-slate-700"
                    >
                      ✏️ Edit
                    </button>
                    <button
                      onClick={() => handleDeleteProduct(p.id)}
                      className="px-2.5 py-1 bg-rose-950/40 hover:bg-rose-900/60 text-rose-400 rounded-lg text-xs font-bold border border-rose-800/50"
                    >
                      🗑️
                    </button>
                  </div>
                </div>
              ))}
            </div>
          </div>

          {/* Orders History */}
          <div className="bg-slate-900 p-5 rounded-2xl border border-slate-800 space-y-3">
            <h2 className="text-sm font-bold text-white uppercase tracking-wider">Recent Orders Feed ({orders.length})</h2>
            {orders.length === 0 ? (
              <div className="text-center text-slate-500 text-xs py-8">No resident orders recorded yet.</div>
            ) : (
              <div className="space-y-2">
                {orders.map(o => (
                  <div key={o.id} className="p-3 bg-slate-950 rounded-xl border border-slate-850 flex justify-between items-center text-xs">
                    <div>
                      <span className="font-mono font-bold text-violet-400">{o.id}</span>
                      <span className="text-slate-400 ml-2">• {o.tower} Tower Flat {o.unit}</span>
                      <span className="text-slate-500 ml-2">({o.timestamp || 'Recent'})</span>
                    </div>
                    <div className="flex items-center gap-3">
                      <span className="font-bold text-white">£{(o.grandTotal || 0).toFixed(2)}</span>
                      <span className={`px-2 py-0.5 rounded font-bold uppercase text-[10px] ${
                        o.status === 'DELIVERED' ? 'bg-emerald-500/20 text-emerald-400' : 'bg-amber-500/20 text-amber-400'
                      }`}>
                        {o.status || 'PLACED'}
                      </span>
                    </div>
                  </div>
                ))}
              </div>
            )}
          </div>

          {/* Edit/Add Product Modal */}
          {showProductModal && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-800 p-5 rounded-3xl max-w-md w-full space-y-3 max-h-[90vh] overflow-y-auto">
                <h3 className="text-white font-bold text-base">
                  {editingProduct ? "Edit Product & Price ✏️" : "Add New Product 🛍️"}
                </h3>

                <div>
                  <label className="block text-xs text-slate-400 mb-1">Product Title</label>
                  <input
                    type="text"
                    value={prodName}
                    onChange={e => setProdName(e.target.value)}
                    className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-white text-sm outline-none"
                    placeholder="e.g. Sourdough Loaf"
                  />
                </div>

                <div className="grid grid-cols-2 gap-2">
                  <div>
                    <label className="block text-xs text-slate-400 mb-1">Category</label>
                    <select
                      value={prodCategory}
                      onChange={e => setProdCategory(e.target.value)}
                      className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-white text-sm outline-none"
                    >
                      <option value="Bakery">Bakery</option>
                      <option value="Cold Drinks">Cold Drinks</option>
                      <option value="Beer & Wine">Beer & Wine</option>
                      <option value="Pantry">Pantry</option>
                      <option value="Snacks">Snacks</option>
                      <option value="Late Night">Late Night</option>
                    </select>
                  </div>
                  <div>
                    <label className="block text-xs text-slate-400 mb-1">Price (£)</label>
                    <input
                      type="number"
                      step="0.05"
                      value={prodPrice}
                      onChange={e => setProdPrice(e.target.value)}
                      className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-white text-sm outline-none font-mono"
                    />
                  </div>
                </div>

                <div className="grid grid-cols-2 gap-2">
                  <div>
                    <label className="block text-xs text-slate-400 mb-1">Unit / Quantity Note</label>
                    <input
                      type="text"
                      value={prodUnit}
                      onChange={e => setProdUnit(e.target.value)}
                      className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-white text-sm outline-none"
                      placeholder="e.g. 500ml Tub"
                    />
                  </div>
                  <div>
                    <label className="block text-xs text-slate-400 mb-1">Badge Tag</label>
                    <input
                      type="text"
                      value={prodBadge}
                      onChange={e => setProdBadge(e.target.value)}
                      className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-white text-sm outline-none"
                      placeholder="e.g. Organic, Chilled"
                    />
                  </div>
                </div>

                <div>
                  <label className="block text-xs text-slate-400 mb-1">Image URL</label>
                  <input
                    type="text"
                    value={prodImage}
                    onChange={e => setProdImage(e.target.value)}
                    className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-white text-sm outline-none font-mono"
                    placeholder="https://images.unsplash.com/..."
                  />
                  {prodImage && (
                    <div className="mt-2">
                      <img src={prodImage} alt="Preview" className="h-16 w-full object-cover rounded-xl border border-slate-800" />
                    </div>
                  )}
                </div>

                <div className="flex gap-2 pt-2">
                  <button onClick={() => setShowProductModal(false)} className="flex-1 bg-slate-800 text-slate-300 font-bold py-2.5 rounded-xl text-xs">Cancel</button>
                  <button onClick={handleSaveProduct} className="flex-1 bg-emerald-500 text-slate-950 font-bold py-2.5 rounded-xl text-xs">Save Product</button>
                </div>
              </div>
            </div>
          )}

          {/* Admin Password Modal */}
          {showAdminPassModal && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-800 p-5 rounded-3xl max-w-sm w-full space-y-3">
                <h3 className="text-white font-bold text-base">Change Admin Password 🔑</h3>
                {passError && <div className="text-xs text-rose-400 font-bold">{passError}</div>}
                <div>
                  <label className="block text-xs text-slate-400 mb-1">New Admin Password</label>
                  <input
                    type="password"
                    value={newPass}
                    onChange={e => setNewPass(e.target.value)}
                    className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-white text-sm outline-none"
                    placeholder="Min 4 chars"
                  />
                </div>
                <div>
                  <label className="block text-xs text-slate-400 mb-1">Confirm Admin Password</label>
                  <input
                    type="password"
                    value={confirmPass}
                    onChange={e => setConfirmPass(e.target.value)}
                    className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-white text-sm outline-none"
                  />
                </div>
                <div className="flex gap-2 pt-2">
                  <button onClick={() => setShowAdminPassModal(false)} className="flex-1 bg-slate-800 text-slate-300 font-bold py-2 rounded-xl text-xs">Cancel</button>
                  <button onClick={handleChangeAdminPass} className="flex-1 bg-violet-600 text-white font-bold py-2 rounded-xl text-xs">Save</button>
                </div>
              </div>
            </div>
          )}

          {/* Runner Password Modal */}
          {showRunnerPassModal && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-800 p-5 rounded-3xl max-w-sm w-full space-y-3">
                <h3 className="text-white font-bold text-base">Change Runner Password 🏃‍♂️</h3>
                {passError && <div className="text-xs text-rose-400 font-bold">{passError}</div>}
                <div>
                  <label className="block text-xs text-slate-400 mb-1">New Runner Passcode</label>
                  <input
                    type="password"
                    value={newPass}
                    onChange={e => setNewPass(e.target.value)}
                    className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-white text-sm outline-none"
                    placeholder="Min 4 chars"
                  />
                </div>
                <div>
                  <label className="block text-xs text-slate-400 mb-1">Confirm Runner Passcode</label>
                  <input
                    type="password"
                    value={confirmPass}
                    onChange={e => setConfirmPass(e.target.value)}
                    className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-white text-sm outline-none"
                  />
                </div>
                <div className="flex gap-2 pt-2">
                  <button onClick={() => setShowRunnerPassModal(false)} className="flex-1 bg-slate-800 text-slate-300 font-bold py-2 rounded-xl text-xs">Cancel</button>
                  <button onClick={handleChangeRunnerPass} className="flex-1 bg-emerald-500 text-slate-950 font-bold py-2 rounded-xl text-xs">Save</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<AdminHub />);
  </script>
</body>
</html>
